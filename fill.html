<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise Gift Box</title>
    <style>
        :root {
            --bg: #f8e9fb;
            --panel: #ffffff;
            --surface: #f8e0f4;
            --pink: #ff7eb9;
            --rose: #d858a5;
            --lavender: #a58ad1;
            --gold: #f9c66f;
            --leaf: #68a46d;
            --text: #3d2143;
            --shadow: 0 30px 80px rgba(87, 43, 90, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top left, rgba(255, 239, 255, 0.96), transparent 28%),
                        radial-gradient(circle at bottom right, rgba(218, 182, 241, 0.38), transparent 28%),
                        linear-gradient(180deg, #fff8ff 0%, #f7e6fa 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 1px);
            background-size: 90px 90px;
            opacity: 0.22;
            pointer-events: none;
        }

        .wrapper {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
            align-items: center;
            z-index: 1;
        }

        .card {
            position: relative;
            padding: 36px;
            border-radius: 32px;
            background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,244,255,0.94));
            border: 1px solid rgba(191, 144, 203, 0.24);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.35), transparent 25%),
                        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.28), transparent 22%);
        }

        .hero {
            margin: 0 0 18px;
            font-size: clamp(2.2rem, 3vw, 3rem);
            letter-spacing: -0.05em;
            line-height: 1.02;
        }

        .text-block {
            margin: 0 0 26px;
            line-height: 1.75;
            color: #5f4468;
            max-width: 680px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 16px 28px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 700;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
            min-width: 140px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink), var(--rose));
            color: white;
            box-shadow: 0 18px 32px rgba(222, 94, 164, 0.24);
        }

        .btn-secondary {
            background: rgba(245, 235, 245, 0.96);
            color: var(--text);
            border: 1px solid rgba(171, 128, 190, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .scene {
            position: relative;
            min-height: 560px;
            display: grid;
            place-items: center;
        }

        .floor {
            position: absolute;
            left: 50%;
            bottom: 18px;
            width: 420px;
            height: 20px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 75%);
            filter: blur(1px);
        }

        .gift-box {
            width: 360px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1100px;
        }

        .box-base,
        .box-lid {
            position: absolute;
            left: 0;
            width: 100%;
            border-radius: 24px;
            border: 1px solid rgba(201, 134, 183, 0.42);
            background: linear-gradient(180deg, #f7e2f5 0%, #e6c4e6 100%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
        }

        .box-base {
            top: 48px;
            height: 196px;
            overflow: hidden;
        }

        .box-base::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 18%, rgba(255,255,255,0.15) 22%, rgba(255,255,255,0) 35%);
        }

        .box-base::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.88));
        }

        .box-lid {
            top: 0;
            height: 120px;
            transform-origin: top center;
            transition: transform 520ms ease;
            box-shadow: 0 24px 46px rgba(129, 48, 118, 0.12);
        }

        .gift-box.open .box-lid {
            transform: rotateX(-72deg) translateY(-24px);
        }

        .ribbon {
            position: absolute;
            left: 50%;
            top: 14px;
            width: 18px;
            height: 206px;
            background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.22));
            transform: translateX(-50%);
            border-radius: 14px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
            z-index: 1;
        }

        .bow {
            position: absolute;
            left: 50%;
            top: 10px;
            width: 100px;
            height: 56px;
            transform: translateX(-50%);
            display: grid;
            place-items: center;
            z-index: 2;
        }

        .bow::before,
        .bow::after {
            content: '';
            width: 52px;
            height: 44px;
            background: linear-gradient(135deg, var(--pink), var(--rose));
            border-radius: 52% 48% 56% 44% / 46% 54% 46% 54%;
            position: absolute;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.12);
        }

        .bow::before {
            left: 0;
            transform: rotate(-30deg);
        }

        .bow::after {
            right: 0;
            transform: rotate(30deg);
        }

        .bow span {
            position: relative;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #ffe1f3, #ff9dca);
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.82);
        }

        .flower-cluster {
            position: absolute;
            top: 86px;
            left: 50%;
            width: 200px;
            height: 200px;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 700ms ease, transform 700ms ease;
            transform-origin: center bottom;
        }

        .gift-box.open .flower-cluster {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        .flower {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffd8ed;
            box-shadow: inset 0 5px 14px rgba(255,255,255,0.65);
        }

        .flower:nth-child(1) { top: 8%; left: 40%; background: #ffb4d6; }
        .flower:nth-child(2) { top: 20%; left: 14%; background: #ffdde1; }
        .flower:nth-child(3) { top: 36%; left: 72%; background: #f2a8d7; }
        .flower:nth-child(4) { top: 52%; left: 24%; background: #ffe5a3; }
        .flower:nth-child(5) { top: 64%; left: 54%; background: #fb8fb1; }

        .flower::before {
            content: '';
            position: absolute;
            inset: 8px;
            background: radial-gradient(circle at center, #fff8f7 0%, rgba(255,255,255,0.35) 55%);
            border-radius: 50%;
        }

        .flower::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.6), transparent 65%);
        }

        .flower::before,
        .flower::after {
            pointer-events: none;
        }

        .camera {
            width: 126px;
            height: 92px;
            border-radius: 24px;
            background: radial-gradient(circle at 32% 30%, #ffffff, #f5d4f2 58%, #e8bfdc 100%);
            border: 4px solid rgba(241, 200, 230, 0.95);
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            box-shadow: 0 28px 40px rgba(120, 65, 135, 0.18);
            opacity: 0;
            transition: transform 500ms ease, opacity 500ms ease;
        }

        .gift-box.open .camera {
            opacity: 1;
            transform: translateX(-50%) translateY(-18px) scale(1);
        }

        .camera::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 22px;
            width: 30px;
            height: 20px;
            border-radius: 10px;
            background: #330124;
        }

        .camera::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #2600ff 0%, #fee4f5 48%, #d08bb0 100%);
            border-radius: 50%;
            border: 7px solid rgba(255,255,255,0.9);
            transform: translate(-50%, -50%);
        }

        .camera .lens-flare {
            position: absolute;
            top: 58%;
            left: 58%;
            width: 14px;
            height: 14px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            filter: blur(1px);
        }

        .balloon {
            position: absolute;
            bottom: 18px;
            width: 68px;
            height: 86px;
            background: linear-gradient(180deg, #ff809d 0%, #e64d8e 100%);
            border-radius: 48% 48% 52% 52%;
            transform-origin: bottom center;
            animation: float 4.8s ease-in-out infinite;
            box-shadow: inset -3px -5px 0 rgba(255,255,255,0.36);
        }

        .balloon:nth-child(1) {
            left: 12%;
            animation-delay: 0s;
        }

        .balloon:nth-child(2) {
            left: 80%;
            width: 64px;
            height: 76px;
            background: linear-gradient(180deg, #fdd76a 0%, #e8b132 100%);
            animation-delay: 0.9s;
        }

        .balloon:nth-child(3) {
            left: 36%;
            width: 74px;
            height: 88px;
            background: linear-gradient(180deg, #520000 0%, #83696f 100%);
            animation-delay: 1.6s;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            width: 2px;
            height: 44px;
            background: rgba(58, 31, 58, 0.18);
            transform: translateX(-50%);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 22px;
            height: 16px;
            background: inherit;
            border-radius: 0 0 50% 50%;
            transform: translateX(-50%);
        }

        .balloon.heart {
            width: 76px;
            height: 76px;
            background: #ff0000;
            border-radius: 50%;
            transform: rotate(-45deg);
            animation-duration: 5.3s;
        }

        .balloon.heart::before,
        .balloon.heart::after {
            content: '';
            position: absolute;
            width: 76px;
            height: 76px;
            background: #ff0000;
            border-radius: 50%;
        }

        .balloon.heart::before {
            top: -38px;
            left: 0;
        }

        .balloon.heart::after {
            top: 0;
            left: 38px;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 4px;
            opacity: 0;
            transform: translateY(0) rotate(0);
        }

        .gift-box.open .confetti {
            opacity: 1;
            animation: confetti 900ms ease forwards;
        }

        .confetti:nth-child(1) { left: 45%; animation-delay: 0ms; background: #fdd76a; }
        .confetti:nth-child(2) { left: 60%; animation-delay: 80ms; background: #ff99c1; }
        .confetti:nth-child(3) { left: 30%; animation-delay: 120ms; background: #c89cf2; }
        .confetti:nth-child(4) { left: 55%; animation-delay: 40ms; background: #9edc8f; }
        .confetti:nth-child(5) { left: 38%; animation-delay: 100ms; background: #f6a3d9; }

        .card-footer {
            margin-top: 24px;
            font-size: 0.98rem;
            color: #7a5c7f;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-22px) rotate(1deg); }
        }

        @keyframes confetti {
            0% { opacity: 0; transform: translateY(0) rotate(0deg); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-240px) translateX(16px) rotate(360deg); }
        }

        @media (max-width: 860px) {
            .wrapper {
                grid-template-columns: 1fr;
            }

            .scene {
                min-height: 500px;
            }
        }

        @media (max-width: 560px) {
            .card {
                padding: 28px;
            }

            .hero {
                font-size: 2.2rem;
            }

            .gift-box {
                width: 300px;
                height: 210px;
            }

            .camera {
                width: 106px;
                height: 78px;
            }

            .flower-cluster {
                width: 160px;
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <section class="card">
            <h1 class="hero">Surprise Gift Box</h1>
            <p class="text-block">pag pasensyahan mo na ang taong ini</p>

            <div class="buttons">
                <button class="btn btn-primary" id="openButton">Open the gift</button>
                <button class="btn btn-secondary" id="resetButton" disabled>Close box</button>
            </div>

            <div class="card-footer">INSPIRED BY YOU</div>
        </section>

        <section class="scene" aria-label="Surprise gift scene">
            <div class="floor"></div>

            <div class="balloon heart" style="left: 14%; animation-delay: 0s;"></div>
            <div class="balloon" style="left: 78%; animation-delay: 0.8s;"></div>
            <div class="balloon" style="left: 40%; animation-delay: 1.5s;"></div>

            <div class="gift-box" id="giftBox">
                <div class="box-lid"></div>
                <div class="bow"><span></span></div>
                <div class="ribbon"></div>
                <div class="box-base"></div>

                <div class="flower-cluster" aria-hidden="true">
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                </div>

                <div class="camera" aria-hidden="true">
                    <div class="lens-flare"></div>
                </div>

                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
                <div class="confetti"></div>
            </div>
        </section>
    </div>

    <script>
        const giftBox = document.getElementById('giftBox');
        const openButton = document.getElementById('openButton');
        const resetButton = document.getElementById('resetButton');

        function setOpenState(open) {
            giftBox.classList.toggle('open', open);
            openButton.textContent = open ? 'Gift opened!' : 'Open the gift';
            resetButton.disabled = !open;
            openButton.disabled = open;
        }

        openButton.addEventListener('click', () => setOpenState(true));
        resetButton.addEventListener('click', () => setOpenState(false));

        // gentle balloon drift on page load
        window.addEventListener('load', () => {
            document.querySelectorAll('.balloon').forEach((balloon, index) => {
                balloon.style.animationDuration = `${4 + index * 0.8}s`;
            });
        });
    </script>
</body>
</html>
